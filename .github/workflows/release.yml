name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG.TrimStart("v")
          $ver = (Select-String -Path version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { Write-Error "Tag $tag does not match version.py ($ver). Bump version.py first."; exit 1 }
      - name: Build exe
        shell: cmd
        run: build_exe.bat < nul
      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" SmartschoolPlanner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash installer_output/SmartschoolPlanner-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("installer_output/SmartschoolPlanner-Setup.exe.sha256", "$h  SmartschoolPlanner-Setup.exe`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SmartschoolPlanner-Setup
          path: |
            installer_output/SmartschoolPlanner-Setup.exe
            installer_output/SmartschoolPlanner-Setup.exe.sha256
          overwrite: true
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: SmartschoolPlanner-Setup
          path: installer_output
      - name: Verify release publisher
        run: python -c "from pathlib import Path; from updater import verify_installer_signature; verify_installer_signature(Path('installer_output/SmartschoolPlanner-Setup.exe'))"
      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            installer_output/SmartschoolPlanner-Setup.exe
            installer_output/SmartschoolPlanner-Setup.exe.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
