name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { Write-Error "Tag $tag does not match version.py ($ver). Bump version.py first."; exit 1 }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exe
        shell: cmd
        run: build_exe.bat < nul
      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" SmartschoolPlanner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash installer_output/SmartschoolPlanner-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("installer_output/SmartschoolPlanner-Setup.exe.sha256", "$h  SmartschoolPlanner-Setup.exe`n")
      - uses: actions/upload-artifact@v7
        with:
          name: SmartschoolPlanner-Setup
          path: installer_output/SmartschoolPlanner-Setup.exe
          overwrite: true
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer_output/SmartschoolPlanner-Setup.exe
            installer_output/SmartschoolPlanner-Setup.exe.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
