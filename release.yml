name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exe
        shell: cmd
        run: build_exe.bat < nul
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" SmartschoolPlanner.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SmartschoolPlanner-Setup
          path: installer_output/SmartschoolPlanner-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/SmartschoolPlanner-Setup.exe
